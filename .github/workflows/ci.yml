name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: nodrama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: nodrama/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Go and UI
        run: go run ./tools/check
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./...

  browser:
    name: browser regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodrama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: nodrama/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nodrama/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: nodrama/test-results/

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [test, browser]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    defaults:
      run:
        working-directory: nodrama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: nodrama/go.mod
      - name: Build
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(cat VERSION)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${TARGET_GOOS}" = "windows" ]; then
            GOOS=linux GOARCH=amd64 go install github.com/tc-hib/go-winres@v0.3.3
            GOOS=linux GOARCH=amd64 go run ./tools/windowsres
            GOOS=linux GOARCH=amd64 go-winres make --arch "${TARGET_GOARCH}"
            strip_flags=""
          else
            strip_flags="-s -w"
          fi
          GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}" go build -trimpath \
            -ldflags "${strip_flags} -X main.version=${version} -X main.commit=${{ github.sha }} -X main.date=${build_date}" \
            -o dist/llama-nodrama-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with:
          name: llama-nodrama-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nodrama/dist/*
