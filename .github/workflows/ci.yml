name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: nodrama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: nodrama/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Go and UI
        run: go run ./tools/check
      - name: Check release staging and manifests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s ../scripts -p 'test_*.py'
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./...

  browser:
    name: browser regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodrama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: nodrama/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nodrama/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: nodrama/test-results/

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [test, browser]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    defaults:
      run:
        working-directory: nodrama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: nodrama/go.mod
      - name: Build
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(cat VERSION)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${TARGET_GOOS}" = "windows" ]; then
            GOOS=linux GOARCH=amd64 go install github.com/tc-hib/go-winres@v0.3.3
            GOOS=linux GOARCH=amd64 go run ./tools/windowsres
            GOOS=linux GOARCH=amd64 go-winres make --arch "${TARGET_GOARCH}"
            strip_flags=""
          else
            strip_flags="-s -w"
          fi
          GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}" go build -trimpath \
            -ldflags "${strip_flags} -X main.version=${version} -X main.commit=${{ github.sha }} -X main.date=${build_date}" \
            -o dist/llama-nodrama-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with:
          name: llama-nodrama-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nodrama/dist/*

  preview:
    name: publish tested preview
    needs: cross-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hangry-labs/llama.nodrama'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: preview-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: llama-nodrama-*
          merge-multiple: true
          path: preview
      - name: Prepare checksums and update manifest
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: python3 scripts/preview_manifest.py preview
      - name: Publish immutable tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Do not promote an older, slower workflow over current main.
          latest="$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)"
          if [ "$latest" != "$BUILD_COMMIT" ]; then exit 0; fi
          tag="preview-$BUILD_COMMIT"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            if [ "$draft" != "true" ]; then
              echo "Already published $tag; leaving its tag and assets unchanged."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$BUILD_COMMIT" --prerelease --latest=false --title "Tested preview ${BUILD_COMMIT:0:12}" --notes "Tested main build $BUILD_COMMIT. Settings persist; restarting resets in-memory telemetry history."
          fi
          # Only drafts may be resumed. Publishing locks the complete asset set.
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" preview/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
