name: release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: build and publish regular release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hangry-labs/llama.nodrama'
    runs-on: ubuntu-latest
    concurrency:
      group: regular-release-publication
      cancel-in-progress: false
    defaults:
      run:
        working-directory: nodrama
    steps:
      - uses: actions/checkout@v4
      - name: Plan regular patch release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)"
          if [ "$latest" != "$BUILD_COMMIT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Main has advanced; the newer run will publish."
            exit 0
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" > "$RUNNER_TEMP/tags.json"
          python3 ../scripts/release_version.py "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/tags.json"
      - uses: actions/setup-go@v5
        if: steps.plan.outputs.skip != 'true'
        with:
          go-version: "1.25.x"
          cache-dependency-path: nodrama/go.mod
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.skip != 'true'
        with:
          node-version: "22"
      - name: Check Go and UI
        if: steps.plan.outputs.skip != 'true'
        run: go run ./tools/check
      - name: Check release staging and manifests
        if: steps.plan.outputs.skip != 'true'
        run: python3 -m unittest discover -s ../scripts -p 'test_*.py'
      - name: Build archives
        if: steps.plan.outputs.skip != 'true'
        env:
          CGO_ENABLED: "0"
          COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$RELEASE_VERSION"
          # Only this runner checkout changes: binary and Windows metadata must
          # contain the actual numbered release, not the source snapshot floor.
          printf '%s\n' "$version" > VERSION
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          build() {
            goos="$1"
            goarch="$2"
            ext="$3"
            archive_name="llama-nodrama-${goos}-${goarch}"
            bin_name="llama-nodrama${ext}"
            work_dir="$(mktemp -d)"
            out="${work_dir}/${bin_name}"
            cp "${GITHUB_WORKSPACE}/LICENSE" "${work_dir}/LICENSE"
            cp "${GITHUB_WORKSPACE}/BRAND_ASSETS.md" "${work_dir}/BRAND_ASSETS.md"
            cp "${GITHUB_WORKSPACE}/THIRD_PARTY_NOTICES.md" "${work_dir}/THIRD_PARTY_NOTICES.md"
            if [ "$goos" = "windows" ]; then
              GOOS=linux GOARCH=amd64 go run ./tools/windowsres
              GOOS=linux GOARCH=amd64 go-winres make --arch "$goarch"
              strip_flags=""
            else
              strip_flags="-s -w"
            fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "${strip_flags} -X main.version=${version} -X main.commit=${COMMIT} -X main.date=${build_date}" \
              -o "$out" .
            if [ "$goos/$goarch" = linux/amd64 ]; then "$out" --version | grep -F "$version"; fi
            if [ "$goos" = "windows" ] && [ -n "${WINDOWS_CODESIGN_PFX_BASE64:-}" ]; then
              if ! command -v osslsigncode >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y osslsigncode
              fi
              cert_path="$(mktemp)"
              printf '%s' "$WINDOWS_CODESIGN_PFX_BASE64" | base64 -d > "$cert_path"
              osslsigncode sign \
                -pkcs12 "$cert_path" \
                -pass "$WINDOWS_CODESIGN_PASSWORD" \
                -n "llama.nodrama" \
                -i "https://github.com/hangry-labs/llama.nodrama" \
                -t "http://timestamp.digicert.com" \
                -in "$out" \
                -out "${out}.signed"
              rm -f "$cert_path"
              mv "${out}.signed" "$out"
            fi
            if [ "$goos" = "windows" ]; then
              (cd "$work_dir" && zip -q "${GITHUB_WORKSPACE}/nodrama/dist/${archive_name}.zip" "$bin_name" LICENSE BRAND_ASSETS.md THIRD_PARTY_NOTICES.md)
            else
              (cd "$work_dir" && tar -czf "${GITHUB_WORKSPACE}/nodrama/dist/${archive_name}.tar.gz" "$bin_name" LICENSE BRAND_ASSETS.md THIRD_PARTY_NOTICES.md)
            fi
            rm -rf "$work_dir"
          }
          build linux amd64 ""
          build linux arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""
          GOOS=linux GOARCH=amd64 go install github.com/tc-hib/go-winres@v0.3.3
          build windows amd64 ".exe"
          build windows arm64 ".exe"
          for archive in dist/llama-nodrama-*.tar.gz; do
            tar -tzf "$archive" | grep -Fx LICENSE >/dev/null
            tar -tzf "$archive" | grep -Fx BRAND_ASSETS.md >/dev/null
            tar -tzf "$archive" | grep -Fx THIRD_PARTY_NOTICES.md >/dev/null
          done
          for archive in dist/llama-nodrama-*.zip; do
            unzip -Z1 "$archive" | grep -Fx LICENSE >/dev/null
            unzip -Z1 "$archive" | grep -Fx BRAND_ASSETS.md >/dev/null
            unzip -Z1 "$archive" | grep -Fx THIRD_PARTY_NOTICES.md >/dev/null
          done
          windows_amd64_hash="$(sha256sum dist/llama-nodrama-windows-amd64.zip | awk '{print $1}')"
          windows_arm64_hash="$(sha256sum dist/llama-nodrama-windows-arm64.zip | awk '{print $1}')"
          winget_version="${version#v}"
          winget_dir="dist/winget"
          mkdir -p "$winget_dir"
          cat > "${winget_dir}/HangryLabs.LlamaNodrama.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.version.1.10.0.schema.json
          PackageIdentifier: HangryLabs.LlamaNodrama
          PackageVersion: ${winget_version}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.10.0
          EOF
          cat > "${winget_dir}/HangryLabs.LlamaNodrama.installer.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
          PackageIdentifier: HangryLabs.LlamaNodrama
          PackageVersion: ${winget_version}
          InstallerType: zip
          NestedInstallerType: portable
          NestedInstallerFiles:
            - RelativeFilePath: llama-nodrama.exe
              PortableCommandAlias: llama-nodrama
          Commands:
            - llama-nodrama
          Installers:
            - Architecture: x64
              InstallerUrl: https://github.com/hangry-labs/llama.nodrama/releases/download/${version}/llama-nodrama-windows-amd64.zip
              InstallerSha256: ${windows_amd64_hash}
            - Architecture: arm64
              InstallerUrl: https://github.com/hangry-labs/llama.nodrama/releases/download/${version}/llama-nodrama-windows-arm64.zip
              InstallerSha256: ${windows_arm64_hash}
          ManifestType: installer
          ManifestVersion: 1.10.0
          EOF
          cat > "${winget_dir}/HangryLabs.LlamaNodrama.locale.en-US.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.defaultLocale.1.10.0.schema.json
          PackageIdentifier: HangryLabs.LlamaNodrama
          PackageVersion: ${winget_version}
          PackageLocale: en-US
          Publisher: Hangry Labs
          PublisherUrl: https://github.com/hangry-labs
          PublisherSupportUrl: https://github.com/hangry-labs/llama.nodrama/issues
          PrivacyUrl: https://github.com/hangry-labs/llama.nodrama/blob/main/PRIVACY.md
          Author: Hangry Labs
          PackageName: llama.nodrama
          PackageUrl: https://github.com/hangry-labs/llama.nodrama
          License: MIT
          LicenseUrl: https://github.com/hangry-labs/llama.nodrama/blob/main/LICENSE
          ShortDescription: Dashboard and monitor for llama.cpp server slots, throughput, cache reuse, and request behavior.
          Moniker: llama-nodrama
          Tags:
            - llama.cpp
            - llm
            - ai
            - dashboard
            - monitor
          ManifestType: defaultLocale
          ManifestVersion: 1.10.0
          EOF
          cat > "${winget_dir}/HangryLabs.LlamaNodrama.locale.ko-KR.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.locale.1.10.0.schema.json
          PackageIdentifier: HangryLabs.LlamaNodrama
          PackageVersion: ${winget_version}
          PackageLocale: ko-KR
          Publisher: Hangry Labs
          PackageName: llama.nodrama
          ShortDescription: llama.cpp 서버 슬롯, 처리량, 캐시 재사용, 요청 흐름을 시각적으로 모니터링하는 대시보드.
          ManifestType: locale
          ManifestVersion: 1.10.0
          EOF
          cat > "${winget_dir}/HangryLabs.LlamaNodrama.locale.ja-JP.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.locale.1.10.0.schema.json
          PackageIdentifier: HangryLabs.LlamaNodrama
          PackageVersion: ${winget_version}
          PackageLocale: ja-JP
          Publisher: Hangry Labs
          PackageName: llama.nodrama
          ShortDescription: llama.cpp サーバーのスロット、スループット、キャッシュ再利用、リクエストの流れを可視化するダッシュボード。
          ManifestType: locale
          ManifestVersion: 1.10.0
          EOF
          cat > "${winget_dir}/HangryLabs.LlamaNodrama.locale.zh-CN.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.locale.1.10.0.schema.json
          PackageIdentifier: HangryLabs.LlamaNodrama
          PackageVersion: ${winget_version}
          PackageLocale: zh-CN
          Publisher: Hangry Labs
          PackageName: llama.nodrama
          ShortDescription: 用于可视化监控 llama.cpp 服务器槽位、吞吐量、缓存复用和请求流程的仪表盘。
          ManifestType: locale
          ManifestVersion: 1.10.0
          EOF
          cat > "${winget_dir}/HangryLabs.LlamaNodrama.locale.es-ES.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.locale.1.10.0.schema.json
          PackageIdentifier: HangryLabs.LlamaNodrama
          PackageVersion: ${winget_version}
          PackageLocale: es-ES
          Publisher: Hangry Labs
          PackageName: llama.nodrama
          ShortDescription: Panel visual para supervisar slots, rendimiento, caché y solicitudes de llama.cpp.
          ManifestType: locale
          ManifestVersion: 1.10.0
          EOF
          (cd dist && zip -qr HangryLabs.LlamaNodrama.winget.zip winget)
          rm -rf "$winget_dir"
          cp "${GITHUB_WORKSPACE}/LICENSE" dist/LICENSE
          cp "${GITHUB_WORKSPACE}/BRAND_ASSETS.md" dist/BRAND_ASSETS.md
          cp "${GITHUB_WORKSPACE}/THIRD_PARTY_NOTICES.md" dist/THIRD_PARTY_NOTICES.md
          BUILD_COMMIT="$COMMIT" python3 ../scripts/release_manifest.py dist
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum LICENSE BRAND_ASSETS.md THIRD_PARTY_NOTICES.md HangryLabs.LlamaNodrama.winget.zip update.json llama-nodrama-* > SHA256SUMS)
      - name: Publish GitHub Release
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
          TAG: ${{ steps.plan.outputs.version }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)"
          if [ "$latest" != "$BUILD_COMMIT" ]; then exit 0; fi
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            target="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
            test "$target" = "$BUILD_COMMIT" || { echo "Release $TAG belongs to another commit."; exit 1; }
            if [ "$draft" != "true" ]; then
              echo "Already published $TAG; leaving its tag and assets unchanged."
              exit 0
            fi
          else
            notes_args=()
            if [ -n "$PREVIOUS_TAG" ]; then notes_args=(--notes-start-tag "$PREVIOUS_TAG"); fi
            gh release create "$TAG" --draft --target "$BUILD_COMMIT" --generate-notes "${notes_args[@]}" --title "llama.nodrama $TAG"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
